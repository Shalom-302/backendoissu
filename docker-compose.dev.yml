# Development overrides — this file IS `docker-compose.override.yml` on the
# `dev` branch, where `docker compose up` (i.e. `shaapi up`) loads it
# automatically.
#
# Three conveniences that must NOT exist in staging or production:
#
#   1. Build the image from this checkout instead of pulling it from GHCR.
#   2. Bind-mount the source so code changes hot-reload (uvicorn --reload)
#      WITHOUT rebuilding. The venv lives at /opt/venv, so the mount does not
#      shadow the installed dependencies.
#   3. Publish the Postgres / MinIO ports on the host for local tooling
#      (psql, DBeaver, the MinIO console at :9001).
#
# The base file keeps those datastores UNPUBLISHED, so an environment that does
# not load this file never exposes 5432 / 9000 to the outside world.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oissu-api:dev
    volumes:
      - .:/app

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
