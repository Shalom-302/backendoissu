# OISSU CONNECT — API stack (main / production).
#
# SELF-CONTAINED ON PURPOSE. There is no docker-compose.override.yml: Dokploy
# deploys with an explicit `-f <compose path>`, and Docker Compose only
# auto-loads an override file when it discovers the files itself. An overlay
# would therefore be silently ignored in production — the stack would start with
# the wrong image on the wrong network and look healthy.
#
# So each branch carries its own complete file:
#   dev      local build, source bind-mounted, datastores published
#   staging  pulls :staging from GHCR, joins dokploy-network, ENVIRONMENT=preprod
#   main     pulls :main    from GHCR, joins dokploy-network, ENVIRONMENT=prod
#
# What you read here is exactly what runs on this branch.
services:
  api:
    # Built and pushed by .github/workflows/docker-publish.yml on every push to
    # this branch. Pin a commit with API_IMAGE=...:sha-1a2b3c4 when you need to.
    image: ${API_IMAGE:-ghcr.io/shalom-302/backendoissu:main}
    # Also the hostname the frontend uses on dokploy-network:
    #   API_INTERNAL_URL=http://oissu_api:8000
    container_name: ${API_CONTAINER_NAME:-oissu_api}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Point the app at the compose service names (overrides .env localhost)
      - POSTGRES_HOST=oissu_postgres
      - REDIS_HOST=oissu_redis
      - MINIO_ENDPOINT=oissu_minio:9000
      - ENVIRONMENT=prod
      # The schema is Alembic's job (the entrypoint runs `alembic upgrade
      # head`), never create_all at boot.
      - DB_AUTO_CREATE=false
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      # `oissu` reaches Postgres, Redis and MinIO; `dokploy-network` is how the
      # frontend reaches this API by container name.
      - oissu
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
        max_attempts: 3

  postgres:
    image: postgres:16-alpine
    container_name: oissu_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DATABASE:-oissu}
    volumes:
      - oissu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-oissu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oissu

  redis:
    image: redis:7-alpine
    container_name: oissu_redis
    restart: unless-stopped
    volumes:
      - oissu_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oissu

  minio:
    # quay.io, not Docker Hub: MinIO closed public access to `minio/minio`
    # there — every tag, and the tag list itself, answers 401 — which broke the
    # first deployment. quay.io is MinIO's other official registry.
    # Pinned rather than `latest`, because `latest` is exactly what turned an
    # upstream change into a failed deploy.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: oissu_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - oissu_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - oissu

volumes:
  oissu_postgres:
  oissu_redis:
  oissu_minio:

networks:
  # Private to this stack: the datastores are reachable from the API and from
  # nothing else.
  oissu:
    driver: bridge
  # Created and owned by Dokploy (overlay, swarm scope). `external` attaches to
  # the existing network instead of creating a second, isolated one.
  dokploy-network:
    external: true
