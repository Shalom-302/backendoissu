# OISSU CONNECT — API stack (dev).
#
# SELF-CONTAINED ON PURPOSE. There is no docker-compose.override.yml: Dokploy
# deploys with an explicit `-f <compose path>`, and Docker Compose only
# auto-loads an override file when it discovers the files itself. An overlay
# would therefore be silently ignored in production — the stack would start with
# the wrong image on the wrong network and look healthy.
#
# So each branch carries its own complete file:
#   dev      local build, source bind-mounted, datastores published
#   staging  pulls :staging from GHCR, joins dokploy-network, ENVIRONMENT=preprod
#   main     pulls :main    from GHCR, joins dokploy-network, ENVIRONMENT=prod
#
# What you read here is exactly what runs on this branch.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oissu-api:dev
    container_name: ${API_CONTAINER_NAME:-oissu_api}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Point the app at the compose service names (overrides .env localhost)
      - POSTGRES_HOST=oissu_postgres
      - REDIS_HOST=oissu_redis
      - MINIO_ENDPOINT=oissu_minio:9000
    volumes:
      # Hot reload without rebuilding. The venv lives at /opt/venv, so this
      # mount does not shadow the installed dependencies.
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - oissu

  postgres:
    image: postgres:16-alpine
    container_name: oissu_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DATABASE:-oissu}
    volumes:
      - oissu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-oissu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Published for local tooling (psql, DBeaver). Staging and production
      # keep the datastores unpublished.
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - oissu

  redis:
    image: redis:7-alpine
    container_name: oissu_redis
    restart: unless-stopped
    volumes:
      - oissu_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oissu

  minio:
    image: minio/minio:latest
    container_name: oissu_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - oissu_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - oissu

volumes:
  oissu_postgres:
  oissu_redis:
  oissu_minio:

networks:
  oissu:
    driver: bridge
