# Staging overlay — Dokploy deployment.
#
# Opt in explicitly, it is NOT loaded by a plain `docker compose up`:
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Dokploy owns an overlay network on the host (`dokploy-network`). The API joins
# it IN ADDITION to the project's own `oissu` network: `oissu` is how it reaches
# Postgres, Redis and MinIO, and `dokploy-network` is how the Next.js frontend
# reaches it by service name — which is what the client's staging configuration
# expects:
#
#   API_INTERNAL_URL=http://oissu_api:8000
#
# The datastores stay on `oissu` only, so nothing but the API is exposed to the
# other stacks sharing the Dokploy network.
services:
  api:
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created and owned by Dokploy (overlay, swarm scope). `external` attaches to
  # the existing network instead of creating a second, isolated one.
  dokploy-network:
    external: true
