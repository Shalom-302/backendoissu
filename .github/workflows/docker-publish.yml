name: Build and publish image

# Every push to a deployment branch produces the image that branch's compose
# file pulls. Dokploy then deploys by pulling a tag, never by compiling on the
# server: `dev` -> :dev, `staging` -> :staging, `main` -> :main and :latest.
on:
  push:
    branches: [dev, staging, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the running build pointless.
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ghcr.io/${{ github.repository }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for GITHUB_TOKEN to push to the repository's own package.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases this; GHCR rejects capitals.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The VPS is amd64; building arm64 as well would double the time for
          # an image nothing pulls.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
